[package]
name = "gh-board"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A GitHub Projects board in the terminal"
license = "MIT"
repository = "https://github.com/krisajenkins/gh-board"
readme = "README.md"
keywords = ["github", "kanban", "tui", "projects", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12"
