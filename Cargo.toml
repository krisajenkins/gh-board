[package]
name = "gh-board"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A GitHub Projects board in the terminal"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12"
